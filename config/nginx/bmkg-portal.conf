# ==============================================================================
# NGINX Reverse Proxy Configuration - Portal Open Data BMKG
# Menjalankan TLS termination dan proxying ke uWSGI socket
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name data.bmkg.go.id localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data.bmkg.go.id localhost;

    # Sertifikat TLS (Hanya di NGINX)
    ssl_certificate /etc/ssl/certs/bmkg-portal.crt;
    ssl_certificate_key /etc/ssl/private/bmkg-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # Static Assets Cache
    location /uploads {
        alias /var/lib/ckan/default/resources;
        expires 1d;
    }

    # Proxy ke uWSGI CKAN
    location / {
        include uwsgi_params;
        uwsgi_pass unix:/tmp/ckan.sock;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
    }
}
