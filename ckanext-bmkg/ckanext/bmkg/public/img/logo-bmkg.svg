<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- BMKG Official Emblem Circle -->
  <defs>
    <linearGradient id="bmkgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066b2"/>
      <stop offset="100%" stop-color="#4ea1d3"/>
    </linearGradient>
    <linearGradient id="bmkgEarth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d882d"/>
      <stop offset="100%" stop-color="#005a28"/>
    </linearGradient>
    <linearGradient id="bmkgGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="57" fill="#ffffff" stroke="#003865" stroke-width="3"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#bmkgGoldRing)" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="#003865"/>

  <!-- Clip Path for inner artwork -->
  <clipPath id="circleClip">
    <circle cx="60" cy="60" r="48"/>
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Sky Background (Meteorologi) -->
    <rect x="0" y="0" width="120" height="66" fill="url(#bmkgSky)"/>

    <!-- Latitude / Longitude lines & Atmosfer curves -->
    <ellipse cx="60" cy="60" rx="44" ry="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.75"/>
    <ellipse cx="60" cy="60" rx="32" ry="46" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="12" y1="60" x2="108" y2="60" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
    
    <!-- White Atmospheric Strata Bands -->
    <path d="M 12 50 Q 60 40 108 50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 16 38 Q 60 28 104 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
    <path d="M 24 26 Q 60 18 96 26" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Green Earth / Mountain (Klimatologi & Geofisika) -->
    <path d="M 10 74 Q 38 52 64 68 Q 88 56 112 76 L 112 120 L 10 120 Z" fill="url(#bmkgEarth)"/>

    <!-- Blue Ocean Waves (Maritim) -->
    <path d="M 10 84 C 30 80, 45 88, 65 82 C 85 76, 95 86, 112 82 L 112 120 L 10 120 Z" fill="#003865" fill-opacity="0.9"/>
    <path d="M 10 94 C 28 90, 48 98, 68 92 C 88 86, 98 96, 112 92 L 112 120 L 10 120 Z" fill="#002244"/>

    <!-- Wave Crest Highlights -->
    <path d="M 12 84 C 30 80, 45 88, 65 82 C 85 76, 95 86, 110 82" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8"/>
    <path d="M 15 94 C 32 90, 50 98, 70 92 C 90 86, 100 96, 108 92" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Golden Center Star / Compass Core -->
  <circle cx="60" cy="60" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2"/>
</svg>
